# docker-compose.yml
# Stack completo OCTO — desarrollo local y despliegue Coolify
#
# Coolify: apunta a este archivo como "Docker Compose" source.
# Todas las variables con ${VAR} se inyectan desde Coolify → Environment Variables.
# F1 public surface: Next.js web console on port 3000 plus API on port 3001.
# The web root renders the Agent Graph Console; API remains under /api/*.
#
# SECURITY: los secretos de runtime siguen fuera de build args. En compose se
# referencian con interpolación explícita `${VAR}` o `${VAR:-default}` para que
# Coolify los materialice dentro de cada servicio; las entradas YAML nulas
# (`KEY:`) resultaron frágiles para bootstrap de infra como PostgreSQL.
#
# ADR F0-014 (Dockerfile strategy), F0-016 (env config), F0-004 (database)
# Principios Arquitectónicos OCTO: #1 (Control/Execution plane separation),
# #12 (PostgreSQL system of record), #16 (every phase must be deployable)

services:
  # ────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE — PostgreSQL
  # Sistema de registro (Principio Arquitectónico #12).
  # Todos los writes de orquestación pasan por aquí.
  # ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.6-alpine3.21
    container_name: octo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-octo}
      POSTGRES_USER: ${POSTGRES_USER:-octo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - octo_postgres_data:/var/lib/postgresql/data
    networks:
      - octonet
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-octo} -d ${POSTGRES_DB:-octo}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE — Redis
  # Solo queue (BullMQ), cache y coordinación transient.
  # NUNCA como sistema de registro (Principio Arquitectónico #12).
  # ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.2-alpine3.21
    container_name: octo-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        exec redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - octo_redis_data:/data
    networks:
      - octonet
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # CONTROL PLANE — NestJS API
  # Orquestación, scheduling, estado, aprobaciones, políticas.
  # Principio #1: NUNCA ejecuta tareas de agente directamente.
  # ────────────────────────────────────────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_POSTGRES_USER: ${RUNTIME_POSTGRES_USER:-octo_runtime}
      RUNTIME_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - octonet
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0-f1}
        BUILD_COMMIT: ${BUILD_COMMIT:-${SOURCE_COMMIT:-local}}
        BUILD_PHASE: ${BUILD_PHASE:-F1}
        BUILD_TIME: ${BUILD_TIME:-local}
    container_name: octo-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_HEALTH_ENDPOINT: ${LITELLM_HEALTH_ENDPOINT:-/health/readiness}
      LITELLM_HEALTH_TIMEOUT_MS: ${LITELLM_HEALTH_TIMEOUT_MS:-5000}
      RUNTIME_WORKER_URL: ${RUNTIME_WORKER_URL:-http://runtime-worker:8000}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-octo-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0-f1}
      BUILD_COMMIT: ${BUILD_COMMIT:-${SOURCE_COMMIT:-local}}
      BUILD_PHASE: ${BUILD_PHASE:-F1}
      BUILD_TIME: ${BUILD_TIME:-local}
    ports:
      - '${PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - octonet
    healthcheck:
      # Path correcto: incluye global prefix 'api' (main.ts: app.setGlobalPrefix('api'))
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health/live >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # PRESENTATION PLANE — Next.js Web Console
  # F1 public surface: / = Agent Graph Console, /status = foundation status.
  # The web service talks to the API over the internal octonet network and
  # forwards only authenticated browser session tokens to Agent Graph APIs.
  # ────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0-f1}
        BUILD_COMMIT: ${BUILD_COMMIT:-${SOURCE_COMMIT:-local}}
        BUILD_PHASE: ${BUILD_PHASE:-F1}
        BUILD_TIME: ${BUILD_TIME:-local}
    container_name: octo-web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      API_URL: ${WEB_API_URL:-http://api:3001/api}
      RUNTIME_WORKER_URL: ${WEB_RUNTIME_WORKER_URL:-http://runtime-worker:8000}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0-f1}
      BUILD_COMMIT: ${BUILD_COMMIT:-${SOURCE_COMMIT:-local}}
      BUILD_PHASE: ${BUILD_PHASE:-F1}
      BUILD_TIME: ${BUILD_TIME:-local}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - octonet
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # EXECUTION PLANE — Python Runtime Worker
  # Ejecución de tareas, razonamiento, herramientas, LLM.
  # Principio #2: isolation total — crashes aquí NO afectan la API.
  # Boundary F1: escribe progreso durable directamente en PostgreSQL
  # (executions, execution_steps, execution_checkpoints,
  # execution_checkpoint_writes, tool_invocations, approvals,
  # outbox_events, worker_heartbeats). F2+ debe mover/abstraer esta
  # persistencia detrás de event-sourcing o una API del Control Plane.
  # ────────────────────────────────────────────────────────────────
  runtime-worker:
    build:
      # CRITICAL: context must be repo root so the Dockerfile can run
      # turbo prune with access to pnpm-lock.yaml and all workspace
      # package.json files. Matches the api service pattern.
      context: .
      dockerfile: docker/runtime-worker.Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0-f1}
        BUILD_COMMIT: ${BUILD_COMMIT:-${SOURCE_COMMIT:-local}}
        BUILD_PHASE: ${BUILD_PHASE:-F1}
    container_name: octo-runtime-worker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '8000'
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      API_URL: ${API_URL:-http://api:3001/api}
      RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-10}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WORKER:-octo-runtime-worker}
      OTEL_SERVICE_VERSION: ${BUILD_VERSION:-0.1.0-f1}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OCTO_TEST_LLM_FAKE: ${OCTO_TEST_LLM_FAKE:-false}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MAX_CONCURRENT_EXECUTIONS: ${MAX_CONCURRENT_EXECUTIONS:-10}
      EXECUTION_TIMEOUT_SECS: ${EXECUTION_TIMEOUT_SECS:-300}
      MAX_EXECUTION_TIMEOUT_MS: ${MAX_EXECUTION_TIMEOUT_MS:-300000}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0-f1}
      BUILD_COMMIT: ${BUILD_COMMIT:-${SOURCE_COMMIT:-local}}
      BUILD_PHASE: ${BUILD_PHASE:-F1}
    expose:
      - '8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - octonet
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/live", timeout=3)',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  outbox-publisher-worker:
    build:
      context: .
      dockerfile: docker/outbox-publisher-worker.Dockerfile
    container_name: octo-outbox-publisher-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OUTBOX_STREAM_KEY: ${OUTBOX_STREAM_KEY:-octo.events}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_PUBLISHER_PORT: ${OUTBOX_PUBLISHER_PORT:-3010}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - octonet
    expose:
      - '3010'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3010/health/ready >/dev/null || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scheduler-worker:
    build:
      context: .
      dockerfile: docker/scheduler-worker.Dockerfile
    container_name: octo-scheduler-worker
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      RUNTIME_WORKER_URL: ${RUNTIME_WORKER_URL:-http://runtime-worker:8000/api/v1/execute}
      EXECUTION_LEASE_SECONDS: ${EXECUTION_LEASE_SECONDS:-90}
      WORKER_CONCURRENCY: ${SCHEDULER_WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-worker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - octonet
    ports:
      - '127.0.0.1:${SCHEDULER_HEALTH_PORT:-3003}:3003'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health/ready >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  reclaimer-worker:
    build:
      context: .
      dockerfile: docker/reclaimer-worker.Dockerfile
    container_name: octo-reclaimer-worker
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      RECLAIM_INTERVAL_MS: ${RECLAIM_INTERVAL_MS:-15000}
      LEASE_TIMEOUT_MS: ${LEASE_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - octonet
    expose:
      - '3011'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3011/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # LLM GATEWAY — LiteLLM
  # Proxy unificado para todos los proveedores LLM.
  # Principio Arquitectónico #6: Nunca usar SDKs de vendor directamente.
  # Todas las llamadas LLM pasan por LiteLLM.
  # ────────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.61.7@sha256:0f7f39f40bf6ba4cc802b991ce8c4eb2fa41c8a25b821e1d2d5197229cad27fe
    container_name: octo-litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - octonet
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health/readiness']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ────────────────────────────────────────────────────────────────
# VOLUMES — persistencia nombrada explícitamente
# Coolify gestiona el ciclo de vida de estos volúmenes.
# ────────────────────────────────────────────────────────────────
volumes:
  octo_postgres_data:
    name: ${OCTO_POSTGRES_VOLUME:-octo_postgres_data}
  octo_redis_data:
    name: ${OCTO_REDIS_VOLUME:-octo_redis_data}

# ────────────────────────────────────────────────────────────────
# NETWORK — red interna del stack
# Todos los servicios se comunican por nombre de container.
# Coolify conecta esta red a su proxy Traefik automáticamente.
# ────────────────────────────────────────────────────────────────
networks:
  octonet:
    name: octonet
    driver: bridge
