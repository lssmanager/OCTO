# .github/workflows/secret-scan.yml
# Issue #32 — [P0][Security] Remove runtime secrets from Docker build layers
#
# Blocking merge/release gate: runs Gitleaks on every push to main and
# feat/** branches, and on every PR targeting main. Also verifies no
# runtime secrets leaked into Docker image layers.

name: Secret Scan

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: Gitleaks & Docker Layer Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    env:
      GITLEAKS_VERSION: 8.28.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI for gate self-tests
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Validate secret gate controls
        run: scripts/verify-secret-scan-gate.sh

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Use the ROOT Dockerfile — it is designed with build context = repo root.
      # docker/api.Dockerfile is the canonical API image path; keep root build context.
      - name: Build image for layer audit
        run: |
          docker build -f docker/api.Dockerfile \
            --build-arg BUILD_VERSION=scan-test \
            --build-arg BUILD_COMMIT=${{ github.sha }} \
            --build-arg BUILD_PHASE=F0 \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t octo-api:scan \
            .

      - name: Audit Docker layers for secrets
        run: scripts/audit-docker-history-secrets.sh --image octo-api:scan
