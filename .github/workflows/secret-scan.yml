# .github/workflows/secret-scan.yml
# Issue #32 — [P0][Security] Remove runtime secrets from Docker build layers
#
# Runs gitleaks on every push to main and feat/** branches,
# and on every PR targeting main.
# Also verifies no runtime secrets leaked into Docker image layers.

name: Secret Scan

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: Gitleaks & Docker Layer Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use the ROOT Dockerfile — it is designed with build context = repo root.
      # docker/api.Dockerfile is the canonical API image path; keep root build context.
      - name: Build image for layer audit
        run: |
          docker build -f docker/api.Dockerfile \
            --build-arg BUILD_VERSION=scan-test \
            --build-arg BUILD_COMMIT=${{ github.sha }} \
            --build-arg BUILD_PHASE=F0 \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t octo-api:scan \
            .

      - name: Audit Docker layers for secrets
        run: |
          echo "=== Docker layer history audit ==="
          FOUND=$(docker history --no-trunc octo-api:scan \
            | grep -iE "(DATABASE_URL|REDIS_URL|POSTGRES_PASSWORD|JWT_SECRET|API_KEY|LITELLM_MASTER_KEY|RUNTIME_API_SECRET)" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: Runtime secret found in Docker image layers:"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: No secrets found in Docker image layers."
