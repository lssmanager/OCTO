name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  POSTGRES_VERSION: "16"
  REDIS_VERSION: "7"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm formatcheck
      - run: pnpm lint
      - run: pnpm arch:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm typecheck

  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm contracts:python
      - run: pnpm contracts:check
      - run: pytest packages/contracts/tests/ -v

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm testunit --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-ts
          path: coverage/

  python-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r apps/runtime-worker/requirements.txt ruff mypy
      - run: python -m ruff check apps/runtime-worker
      - run: python -m mypy apps/runtime-worker --ignore-missing-imports

  runtime-worker-tests:
    runs-on: ubuntu-latest
    needs: [python-lint-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_INTERNAL_SECRET: test-internal-secret-minimum-32-chars
      DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
      REDIS_URL: redis://localhost:6379
      LITELLM_API_KEY: test-litellm-key-minimum-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install runtime-worker dependencies
        working-directory: apps/runtime-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio asyncpg

      - name: Run canonical execution path test
        working-directory: apps/runtime-worker
        run: |
          python -m pytest tests/unit/test_execution_canonical_path.py -v

      - name: Run runtime-worker test suite
        working-directory: apps/runtime-worker
        run: |
          python -m pytest tests/ -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, contracts-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm testintegration --reporter=verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: test-results/

  python-integration-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests, python-lint-typecheck, runtime-worker-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      API_INTERNAL_SECRET: test-internal-secret-minimum-32-chars
      DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
      REDIS_URL: redis://localhost:6379
      LITELLM_API_KEY: test-litellm-key-minimum-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r apps/runtime-worker/requirements.txt
      - run: pytest apps/runtime-worker/tests/ -v --tb=short

  docker-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [integration-tests]
    strategy:
      matrix:
        service: [api, runtime-worker, scheduler-worker, reclaimer-worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -f docker/${{ matrix.service }}.Dockerfile \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t octo/${{ matrix.service }}:sha-${{ github.sha }} \
            --cache-from type=gha --cache-to type=gha,mode=max .
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker tag octo/${{ matrix.service }}:sha-${{ github.sha }} octo/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag octo/${{ matrix.service }}:sha-${{ github.sha }} octo/${{ matrix.service }}:latest
          fi
          docker save octo/${{ matrix.service }}:sha-${{ github.sha }} -o ${{ matrix.service }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft octo/${{ matrix.service }}:sha-${{ github.sha }} -o cyclonedx-json > sbom-${{ matrix.service }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
      - name: Verify docker hardening
        run: pnpm docker:verify-hardening

  docker-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      matrix:
        service: [api, runtime-worker, scheduler-worker, reclaimer-worker, migrate]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
      - run: docker load -i ${{ matrix.service }}.tar
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: octo/${{ matrix.service }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
      - name: Cosign sign (main + secret)
        if: github.ref == 'refs/heads/main' && secrets.COSIGN_KEY != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/sigstore/cosign/main/install.sh | sh -s -- -b /usr/local/bin
          COSIGN_PASSWORD=${{ secrets.COSIGN_PASSWORD }} cosign sign --key env://COSIGN_KEY octo/${{ matrix.service }}:sha-${{ github.sha }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
