name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  lockfile:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # C4: Fails if pnpm-lock.yaml is missing or desynchronized from package.json.
      # --frozen-lockfile prevents pnpm from generating/updating the lockfile on the fly;
      # if the lockfile is absent or stale, install fails immediately.
      - name: Verify lockfile sync
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "FAIL: pnpm-lock.yaml is missing."
            exit 1
          fi
          HUSKY=0 pnpm install --frozen-lockfile

  quality:
    name: Quality Check
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Boundary enforcement
        run: pnpm lint:boundaries

      - name: Check runtime-state import allowlist
        run: pnpm --filter @octo/runtime-state check:deps

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────────────
  # Contract Parity — must pass before tests run.
  #
  # What this job does:
  #   1. Builds @octo/contracts (compiles Zod schemas to JS)
  #   2. Runs codegen to emit packages/contracts/generated/contracts.py
  #   3. Runs validate-contract-parity.py against all 5 fixtures
  #
  # Why it runs AFTER quality but BEFORE test:
  #   - quality ensures the TS compiles; codegen needs compiled output
  #   - test jobs consume queue jobs validated here; if contracts drift,
  #     failing here gives a clearer signal than a cryptic Python traceback
  #
  # Failure scenarios this catches:
  #   A) TypeScript schema changed, contracts.py not regenerated (drift)
  #   B) contracts.py regenerated but fixture not updated (stale fixture)
  #   C) contracts.py import error (codegen script broke)
  #   D) Pydantic model rejects valid fixture (type mapping regression)
  # ─────────────────────────────────────────────────────────────────────────
  contract-parity:
    name: Contract Parity
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build @octo/contracts
        run: pnpm turbo build --filter=@octo/contracts

      - name: Generate contracts.py
        run: |
          cd packages/contracts
          GIT_COMMIT=${{ github.sha }} pnpm codegen

      - name: Install Python dependencies
        run: pip install pydantic==2.11.5

      - name: Validate contract parity
        run: python packages/contracts/tests/validate-contract-parity.py

      - name: Upload contracts.py artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-py-${{ github.sha }}
          path: packages/contracts/generated/contracts.py
          retention-days: 30

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [quality, contract-parity]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
          REDIS_URL: redis://localhost:6379

  # C3: Docker build validation for the API image.
  # Uses the root Dockerfile (context = repo root, required for turbo prune).
  # Does NOT push — only validates that the image builds successfully.
  docker-build:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build \
            --build-arg BUILD_VERSION=ci-test \
            --build-arg BUILD_COMMIT=${{ github.sha }} \
            --build-arg BUILD_PHASE=F0 \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t octo-api:ci \
            .
