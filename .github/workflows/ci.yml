name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  PNPM_VERSION: '11.2.2'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  POSTGRES_VERSION: '16'
  REDIS_VERSION: '7'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm formatcheck
      - run: pnpm lint
      - run: pnpm arch:check
      - run: pnpm security:vitest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm typecheck

  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm contracts:python
      - run: pnpm contracts:check
      - run: pytest packages/contracts/tests/ -v

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm testunit
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-ts
          path: coverage/

  python-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r apps/runtime-worker/requirements.txt ruff mypy
      - run: python -m ruff check apps/runtime-worker
      - run: python -m mypy apps/runtime-worker --ignore-missing-imports

  runtime-worker-tests:
    runs-on: ubuntu-latest
    needs: [python-lint-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_INTERNAL_SECRET: test-internal-secret-minimum-32-chars
      DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
      REDIS_URL: redis://localhost:6379
      LITELLM_API_KEY: test-litellm-key-minimum-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install runtime-worker dependencies
        working-directory: apps/runtime-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio asyncpg

      - name: Run canonical execution path test
        working-directory: apps/runtime-worker
        run: |
          python -m pytest tests/unit/test_execution_canonical_path.py -v

      - name: Run runtime-worker test suite
        working-directory: apps/runtime-worker
        run: |
          python -m pytest tests/ -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, contracts-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-ci
      JWT_SIGNING_KEYS: '[{"kid":"tenant-isolation-test","algorithm":"HS256","isActive":true,"secret":"test-secret-ci"}]'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm testintegration --reporter=verbose
      - run: pnpm test:tenant-isolation --reporter=verbose
      - run: pnpm test:observability --reporter=verbose
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: test-results/

  python-integration-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests, python-lint-typecheck, runtime-worker-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo_test
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      API_INTERNAL_SECRET: test-internal-secret-minimum-32-chars
      DATABASE_URL: postgresql://octo:octo@localhost:5432/octo_test
      REDIS_URL: redis://localhost:6379
      LITELLM_API_KEY: test-litellm-key-minimum-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r apps/runtime-worker/requirements.txt
      - run: pytest apps/runtime-worker/tests/ -v --tb=short

  f1-close-gate:
    runs-on: ubuntu-latest
    needs: [integration-tests, runtime-worker-tests, python-integration-tests]
    env:
      NODE_ENV: test
      POSTGRES_DB: octo
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: octo
      REDIS_PASSWORD: octo
      F1_HOST_DATABASE_URL: postgresql://octo:octo@localhost:5432/octo
      F1_HOST_REDIS_URL: redis://:octo@localhost:6379
      F1_COMPOSE_DATABASE_URL: postgresql://octo:octo@postgres:5432/octo
      F1_COMPOSE_REDIS_URL: redis://:octo@redis:6379
      JWT_SECRET: dev-secret
      JWT_SIGNING_KEYS: '[{"kid":"dev-hs256","algorithm":"HS256","isActive":true,"secret":"dev-secret"}]'
      RUNTIME_API_SECRET: test-runtime-secret-minimum-32-chars
      LITELLM_MASTER_KEY: sk-f1-close-gate-minimum-16
      OPENAI_API_KEY: sk-f1-close-gate-fake-openai-key
      OCTO_TEST_LLM_FAKE: tool_echo
      OTEL_ENABLED: 'false'
      RECLAIM_INTERVAL_MS: '1000'
      LEASE_TIMEOUT_MS: '1000'
      OUTBOX_POLL_INTERVAL_MS: '250'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          HUSKY=0 pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -r apps/runtime-worker/requirements.txt pytest pytest-asyncio asyncpg
      - name: Run strict F1 close gate
        run: pnpm f1:close-gate
      - name: Capture compose diagnostics
        if: failure()
        run: |
          mkdir -p f1-close-gate-artifacts
          docker compose ps > f1-close-gate-artifacts/compose-ps.txt || true
          docker compose logs --no-color > f1-close-gate-artifacts/compose.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: f1-close-gate-diagnostics
          path: f1-close-gate-artifacts/

  docker-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [integration-tests]
    strategy:
      matrix:
        service: [api, runtime-worker, scheduler-worker, reclaimer-worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -f docker/${{ matrix.service }}.Dockerfile \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t octo/${{ matrix.service }}:sha-${{ github.sha }} \
            --cache-from type=gha --cache-to type=gha,mode=max .
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker tag octo/${{ matrix.service }}:sha-${{ github.sha }} octo/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag octo/${{ matrix.service }}:sha-${{ github.sha }} octo/${{ matrix.service }}:latest
          fi
          docker save octo/${{ matrix.service }}:sha-${{ github.sha }} -o ${{ matrix.service }}.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Generate SBOM
        run: syft octo/${{ matrix.service }}:sha-${{ github.sha }} -o cyclonedx-json > sbom-${{ matrix.service }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json
      - name: Verify docker hardening
        run: pnpm docker:verify-hardening

  docker-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      matrix:
        service: [api, runtime-worker, scheduler-worker, reclaimer-worker, migrate]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
      - run: docker load -i ${{ matrix.service }}.tar
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: octo/${{ matrix.service }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && secrets.COSIGN_KEY != ''
        uses: sigstore/cosign-installer@v3.10.0

      - name: Cosign sign (main + secret)
        if: github.ref == 'refs/heads/main' && secrets.COSIGN_KEY != ''
        run: COSIGN_PASSWORD=${{ secrets.COSIGN_PASSWORD }} cosign sign --key env://COSIGN_KEY octo/${{ matrix.service }}:sha-${{ github.sha }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
