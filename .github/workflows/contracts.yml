name: Contracts Sync

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6
      # pnpm 11.2.2 requires Node >= 22.13 during action bootstrap.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.15.0'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - name: Install deps
        run: HUSKY=0 pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install datamodel-code-generator pydantic pytest
      - name: Full contract validation (schema, generated Python, conformance, drift)
        run: pnpm contracts:validate
