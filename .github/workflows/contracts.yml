name: Contracts Sync

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.2.2'
  PYTHON_VERSION: '3.12'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TURBO_TELEMETRY_DISABLED: ${{ env.TURBO_TELEMETRY_DISABLED }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install deps
        run: HUSKY=0 pnpm install --frozen-lockfile
      - name: F1 tooling reproducibility gate
        run: pnpm f1:tooling-gate
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install datamodel-code-generator pydantic pytest
      - name: Validate contracts end to end
        run: pnpm contracts:validate
