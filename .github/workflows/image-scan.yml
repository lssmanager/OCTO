# .github/workflows/image-scan.yml
# B2: Trivy vulnerability scan — fails on HIGH/CRITICAL CVEs.
# B3: SBOM generation via Syft — uploaded as CI artifact.
#
# Runs on every push to main and on PRs targeting main.
# The API image is built first, then scanned.

name: Image Scan & SBOM

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  scan:
    name: Trivy Scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the API image first — Trivy and Syft need the image to exist.
      - name: Build API image
        run: |
          docker build -f docker/api.Dockerfile \
            --build-arg BUILD_VERSION=scan \
            --build-arg BUILD_COMMIT=${{ github.sha }} \
            --build-arg BUILD_PHASE=F0 \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t octo-api:scan \
            .

      # B3 — Generate SBOM with Syft and upload as artifact.
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: octo-api:scan
          format: cyclonedx-json
          output-file: sbom-api.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api-${{ github.sha }}
          path: sbom-api.cyclonedx.json
          retention-days: 30

      # B2 — Trivy image vulnerability scan.
      # Exit code 1 on HIGH or CRITICAL findings.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: octo-api:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
