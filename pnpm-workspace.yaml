packages:
  - 'apps/*'
  - 'packages/*'

settings:
  injectWorkspacePackages: true

overrides:
  uuid: "10.0.0"
  glob: "11.0.0"
  source-map: "0.7.4"
  typescript: "5.9.3"

onlyBuiltDependencies:
  - "@nestjs/core"
  - esbuild
  - msgpackr-extract
  - protobufjs
  - unrs-resolver

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  unrs-resolver: true
