packages:
  - 'apps/*'
  - 'packages/*'

settings:
  injectWorkspacePackages: true

overrides:
  uuid: '11.1.1'
  glob: '11.1.0'
  lodash: '4.18.1'
  picomatch: '4.0.4'
  path-to-regexp: '8.4.0'
  qs: '6.15.2'
  multer: '2.1.1'
  js-yaml: '4.1.1'
  ip-address: '10.2.0'
  'eslint>ajv': '6.14.0'
  '@eslint/eslintrc>ajv': '6.14.0'
  '@angular-devkit/core>ajv': '8.18.0'
  '@angular-devkit/core>ajv-formats': '2.1.1'
  file-type: '21.3.2'
  webpack: '5.104.1'
  source-map: '0.7.4'
  typescript: '5.9.3'
  esbuild: '0.25.12'
  vitest: '4.1.8'
  '@vitest/coverage-v8': '4.1.8'
  '@vitest/ui': '4.1.8'
  '@vitest/browser': '4.1.8'
  '@vitest/coverage-istanbul': '4.1.8'
  vite: '6.4.2'
  postcss: '8.5.14'
  tmp: '0.2.5'
  brace-expansion: '1.1.15'

onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
  - msgpackr-extract
  - protobufjs
  - sharp
  - unrs-resolver

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.60.1'
  - '@typescript-eslint/project-service@8.60.1'
  - '@typescript-eslint/scope-manager@8.60.1'
  - '@typescript-eslint/tsconfig-utils@8.60.1'
  - '@typescript-eslint/type-utils@8.60.1'
  - '@typescript-eslint/types@8.60.1'
  - '@typescript-eslint/typescript-estree@8.60.1'
  - '@typescript-eslint/utils@8.60.1'
  - '@typescript-eslint/visitor-keys@8.60.1'
  - '@vitest/*'
  - 'vitest@4.1.8'
  - 'bullmq@5.77.7'
  - 'react@19.2.7'
  - 'react-dom@19.2.7'
  - '@types/react@19.2.16'
