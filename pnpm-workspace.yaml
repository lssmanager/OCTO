packages:
  - 'apps/*'
  - 'packages/*'

settings:
  injectWorkspacePackages: true

overrides:
  uuid: "11.1.1"
  glob: "11.1.0"
  lodash: "4.18.1"
  picomatch: "4.0.4"
  path-to-regexp: "8.4.0"
  qs: "6.15.2"
  multer: "2.1.1"
  js-yaml: "4.1.1"
  ajv: "8.18.0"
  file-type: "21.3.2"
  webpack: "5.104.1"
  source-map: "0.7.4"
  typescript: "5.9.3"
  esbuild: "0.25.12"
  vite: "6.4.2"
  postcss: "8.5.14"
  tmp: "0.2.5"
  brace-expansion: "1.1.14"

onlyBuiltDependencies:
  - "@nestjs/core"
  - esbuild
  - msgpackr-extract
  - protobufjs
  - sharp
  - unrs-resolver

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
