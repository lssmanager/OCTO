# infra/docker-compose.observability.debug.yml
# Loopback-only host bindings for local observability debugging.
# Production/default observability stays internal to its compose network.

services:
  otel-collector:
    ports:
      - '127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_PROM_PORT:-8889}:8889'

  prometheus:
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3100}:3000'

  loki:
    ports:
      - '127.0.0.1:${LOKI_PORT:-3200}:3100'
