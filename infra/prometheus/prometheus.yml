global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: 'octo-api'
    static_configs:
      - targets: ['host.docker.internal:3001']

  - job_name: 'octo-runtime-worker'
    static_configs:
      - targets: ['host.docker.internal:8001']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
