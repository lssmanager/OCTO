groups:
  - name: octo.f1.critical
    interval: 1m
    rules:
      - alert: OctoDLQGrowthCritical
        expr: rate(octo_execution_dlq_total[10m]) * 60 > 2
        for: 2m
        labels: { severity: critical, team: platform-reliability }
        annotations:
          summary: "DLQ growing faster than 2 jobs/min"
          description: "DLQ growth rate is {{ $value | humanize }} jobs/min. Investigate poison messages."
          runbook_url: "docs/runbooks/dlq-growth.md"
          dashboard_url: "/d/octo-f1-runtime"
      - alert: OctoRLSViolationDetected
        expr: increase(octo_rls_violation_total[5m]) > 0
        for: 0m
        labels: { severity: critical, team: security }
        annotations:
          summary: "Cross-tenant RLS violation detected"
          description: "Table {{ $labels.table }} had {{ $value }} violation(s) in the last 5m."
          runbook_url: "docs/runbooks/rls-violation.md"
          dashboard_url: "/d/octo-f1-security"
      - alert: OctoAuthCrossTenantAttempt
        expr: increase(octo_auth_failure_total{reason="WRONG_TENANT"}[5m]) > 3
        for: 1m
        labels: { severity: critical, team: security }
        annotations:
          summary: "Multiple cross-tenant auth attempts detected"
          description: "{{ $value }} WRONG_TENANT auth failures detected in the last 5m."
          runbook_url: "docs/runbooks/rls-violation.md"
          dashboard_url: "/d/octo-f1-security"
      - alert: OctoCheckpointRecoveryFailed
        expr: increase(octo_execution_replay_total{result="CHECKPOINT_INVALID"}[10m]) > 0
        for: 0m
        labels: { severity: critical, team: platform-reliability }
        annotations:
          summary: "Checkpoint recovery failed"
          description: "Checkpoint recovery or replay detected invalid checkpoint lineage/schema."
          runbook_url: "docs/runbooks/reclaim-failures.md"
          dashboard_url: "/d/octo-f1-runtime"
      - alert: OctoWorkerHeartbeatStale
        expr: octo_execution_active_gauge > 0 and max(octo_worker_heartbeat_age_seconds) > 120
        for: 2m
        labels: { severity: critical, team: platform-reliability }
        annotations:
          summary: "Runtime worker heartbeat stale while executions are active"
          description: "At least one worker heartbeat is older than 120s while active executions exist."
          runbook_url: "docs/runbooks/worker-heartbeat-stale.md"
          dashboard_url: "/d/octo-f1-runtime"
  - name: octo.f1.high
    interval: 2m
    rules:
      - record: octo_worker_heartbeat_age_seconds
        expr: time() - octo_worker_last_heartbeat_timestamp_seconds
      - record: octo_litellm_circuit_open_gauge
        expr: max(octo_litellm_circuit_state{state="OPEN"})
      - record: octo_persisted_step_tokens_output_total
        expr: sum(octo_execution_step_output_tokens_total)
      - alert: OctoReclaimRateLow
        expr: |
          (
            rate(octo_execution_reclaim_total[1h]) / clamp_min(rate(octo_execution_started_total[1h]), 1)
          ) > 0.01 and (
            rate(octo_execution_reclaim_total{result!~"SUCCESS"}[1h]) / clamp_min(rate(octo_execution_reclaim_total[1h]), 1)
          ) > 0.01
        for: 10m
        labels: { severity: high, team: platform-reliability }
        annotations:
          summary: "Reclaim failures exceed 1%"
          description: "More than 1% of executions require reclaim and more than 1% of reclaims are not successful."
          runbook_url: "docs/runbooks/reclaim-failures.md"
          dashboard_url: "/d/octo-f1-runtime"
      - alert: OctoLiteLLM5xxHigh
        expr: rate(octo_litellm_request_total{status="error"}[5m]) / clamp_min(rate(octo_litellm_request_total[5m]), 1) > 0.05
        for: 5m
        labels: { severity: high, team: ai-runtime }
        annotations:
          summary: "LiteLLM error rate above 5%"
          description: "LiteLLM provider/gateway error rate exceeded 5% over 5m."
          runbook_url: "docs/runbooks/litellm-5xx.md"
          dashboard_url: "/d/octo-f1-llm"
      - alert: OctoQueueOldestJobAge
        expr: octo_queue_oldest_job_age_seconds{queue_name="execution.dispatch"} > 60
        for: 3m
        labels: { severity: high, team: platform-reliability }
        annotations:
          summary: "Oldest dispatch queue job is older than 60s"
          description: "execution.dispatch has jobs waiting for more than 60s."
          runbook_url: "docs/runbooks/queue-oldest-job-age.md"
          dashboard_url: "/d/octo-f1-queues"
      - alert: OctoCircuitBreakerOpen
        expr: octo_litellm_circuit_open_gauge > 0
        for: 1m
        labels: { severity: high, team: ai-runtime }
        annotations:
          summary: "LiteLLM circuit breaker open"
          description: "At least one provider/model circuit breaker is open."
          runbook_url: "docs/runbooks/circuit-breaker-open.md"
          dashboard_url: "/d/octo-f1-llm"
      - alert: OctoOutboxPublishFailed
        expr: increase(octo_outbox_publish_failed_total[10m]) > 5
        for: 5m
        labels: { severity: high, team: platform-reliability }
        annotations:
          summary: "Outbox publisher failures detected"
          description: "More than 5 outbox publish failures in the last 10m."
          runbook_url: "docs/runbooks/outbox-publish-failed.md"
          dashboard_url: "/d/octo-f1-events"
      - alert: OctoBudgetExceededRate
        expr: increase(octo_budget_exceeded_total[1h]) > 10
        for: 5m
        labels: { severity: high, team: platform-reliability }
        annotations:
          summary: "Budget exceeded events above threshold"
          description: "More than 10 budget exceeded events in the last hour."
          runbook_url: "docs/runbooks/budget-exceeded.md"
          dashboard_url: "/d/octo-f1-llm"
      - alert: OctoTokenAccountingDrift
        expr: abs(sum(increase(octo_litellm_tokens_output_total[15m])) - sum(increase(octo_persisted_step_tokens_output_total[15m]))) / clamp_min(sum(increase(octo_persisted_step_tokens_output_total[15m])), 1) > 0.005
        for: 15m
        labels: { severity: high, team: ai-runtime }
        annotations:
          summary: "Token accounting drift above 0.5%"
          description: "Runtime LiteLLM token counters differ from persisted step token totals by more than 0.5%."
          runbook_url: "docs/runbooks/token-drift.md"
          dashboard_url: "/d/octo-f1-llm"
  - name: octo.f1.medium
    interval: 5m
    rules:
      - alert: OctoExecutionSuccessRateLow
        expr: rate(octo_execution_completed_total{status="SUCCEEDED"}[1h]) / clamp_min(rate(octo_execution_completed_total[1h]), 1) < 0.97
        for: 15m
        labels: { severity: medium, team: platform-reliability }
        annotations:
          summary: "Execution success rate below 97%"
          description: "Execution success rate has been below 97% for 15m."
          runbook_url: "docs/runbooks/execution-success-rate.md"
          dashboard_url: "/d/octo-f1-runtime"
      - alert: OctoToolTimeoutRateHigh
        expr: rate(octo_tool_invocation_total{status="TIMED_OUT"}[30m]) / clamp_min(rate(octo_tool_invocation_total[30m]), 1) > 0.02
        for: 10m
        labels: { severity: medium, team: runtime-tools }
        annotations:
          summary: "Tool timeout rate above 2%"
          description: "More than 2% of tool invocations have timed out over 30m."
          runbook_url: "docs/runbooks/tool-timeouts.md"
          dashboard_url: "/d/octo-f1-tools"
      - alert: OctoApprovalPendingHigh
        expr: sum(octo_tool_approval_pending_gauge) > 20
        for: 10m
        labels: { severity: medium, team: operations }
        annotations:
          summary: "Too many pending approvals"
          description: "There are more than 20 pending approvals."
          runbook_url: "docs/runbooks/approval-pending.md"
          dashboard_url: "/d/octo-f1-approvals"
      - alert: OctoQueueDLQGrowing
        expr: increase(octo_queue_dlq_gauge[30m]) > 5
        for: 10m
        labels: { severity: medium, team: platform-reliability }
        annotations:
          summary: "Queue DLQ is growing"
          description: "Queue DLQ increased by more than 5 entries in 30m."
          runbook_url: "docs/runbooks/dlq-growth.md"
          dashboard_url: "/d/octo-f1-queues"
      - alert: OctoContractDriftDetected
        expr: increase(octo_contract_drift_check_failed_total[1h]) > 0
        for: 0m
        labels: { severity: medium, team: developer-platform }
        annotations:
          summary: "Contract drift detected"
          description: "TS/Python or schema contract drift check failed."
          runbook_url: "docs/runbooks/contract-drift.md"
          dashboard_url: "/d/octo-f1-contracts"
