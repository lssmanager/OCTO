global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-prometheus-exporter'
    static_configs:
      - targets: ['host.docker.internal:9464']

  - job_name: 'api-metrics-endpoint'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
