global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-prometheus-exporter'
    static_configs:
      - targets: ['api:9464']

  - job_name: 'api-metrics-endpoint'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:3001']

  - job_name: 'runtime-worker-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['runtime-worker:9464']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
