# OCTO Observability Stack
# Start with: docker compose -f infra/compose/docker-compose.observability.yml up -d

version: '3.9'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: octo-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'   # gRPC
      - '4318:4318'   # HTTP
      - '8888:8888'   # metrics

  prometheus:
    image: prom/prometheus:latest
    container_name: octo-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: octo-grafana
    restart: unless-stopped
    ports:
      - '3100:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../grafana/datasources:/etc/grafana/provisioning/datasources

  loki:
    image: grafana/loki:latest
    container_name: octo-loki
    restart: unless-stopped
    ports:
      - '3200:3100'
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: octo-network
    external: true
