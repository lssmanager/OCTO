# OCTO Redis Configuration
# Used by: BullMQ job queues, transient locks, rate limiting, short-lived cache
#
# Redis is NOT for:
# - Execution persistence (PostgreSQL)
# - Memory records (Qdrant + PostgreSQL)
# - Sessions (JWT stateless)
# - Event sourcing (PostgreSQL execution_events)
#
# See F0-003-n8n-infrastructure-patterns.md for rationale.

# Memory limit — prevents OOM on small VPS instances
maxmemory 256mb

# Eviction policy: remove least-recently-used keys when memory limit is hit
# allkeys-lru is correct for queue/cache workloads (all keys are temporary)
maxmemory-policy allkeys-lru

# Persistence: AOF (Append Only File) for durability of in-flight BullMQ jobs
# If Redis crashes mid-flight, jobs survive and are re-processed on restart
appendonly yes
appendfsync everysec

# RDB snapshot: safety net every 60s if >= 1000 changes
save 60 1000

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Connection limits
maxclients 128
tcp-keepalive 60
