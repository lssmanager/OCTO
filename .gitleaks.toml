# .gitleaks.toml
# Gitleaks configuration for OCTO monorepo.
# Allowlists prevent false positives on test fixtures, acceptance logs,
# and documentation that contain placeholder or example values.

title = "OCTO Gitleaks Config"

[extend]
  # Preserve the full built-in Gitleaks ruleset; local entries below only add
  # narrowly scoped allowlists for known false-positive paths.
  useDefault = true

[[allowlists]]
  description = "Allow test fixtures, acceptance log stubs, and docs"
  paths = [
    # F0 acceptance evidence — placeholder log stubs, not real secrets
    '''docs/f0-acceptance/.*\.log''',
    # pnpm lockfile — contains package registry URLs, not secrets
    '''pnpm-lock\.yaml''',
    # Drizzle migration SQL files — may contain schema strings
    '''drizzle/.*\.sql''',
  ]
  regexes = [
    # Placeholder tokens used in test fixtures and docs
    '''PLACEHOLDER''',
  ]

[[rules]]
  id = "generic-api-key"

  [[rules.allowlists]]
    description = "Allow runtime-worker tests to pass the configured internal secret variable as an HTTP header; no literal secret is stored."
    condition = "AND"
    regexTarget = "line"
    paths = [
      '''apps/runtime-worker/tests/unit/test_execution_canonical_path\.py''',
    ]
    regexes = [
      '''x-internal-secret''',
    ]
